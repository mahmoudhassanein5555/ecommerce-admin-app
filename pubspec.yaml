name: ecommerce_admin_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.3
  dio: ^5.3.0
  dartz: ^0.10.1
  flutter_screenutil: ^5.9.0
  get_it: ^7.6.0
  injectable: ^2.3.2
  flutter_secure_storage: ^9.0.0
  meta: ^1.9.0
  cached_network_image: ^3.3.1
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^5.0.2
  equatable: ^2.0.5
  toastification: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  injectable_generator: ^2.10.0

flutter:
  uses-material-design: true

  # رصة الخطوط الصايعة لـ SwiftBuy
  fonts:
    - family: SwiftBuyBrand
      fonts:
        - asset: assets/fonts/DenkOne-Regular.ttf

    - family: SwiftBuyBody
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
